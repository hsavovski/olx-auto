{% extends "base.html" %}
{% block title %}Log in · olx-auto{% endblock %}
{% block content %}
<div class="center">
  <div class="brand"><span class="brand-mark">oa</span><span>olx-auto</span></div>
  <form class="card" method="post" action="/login">
    {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
    <label for="username">User</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn big" type="submit">Log in</button></div>
  </form>
</div>
{% endblock %}
