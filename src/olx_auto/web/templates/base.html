<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}olx-auto{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root { --bg: #f6f6f4; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e2e2dd;
            --accent: #0b6e4f; --accent-fg: #fff; --warn-bg: #fff4d6; --err: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141413; --card: #1e1e1c; --fg: #ececea; --muted: #9b9b95; --line: #33332f;
              --accent: #3fb68b; --accent-fg: #0b0b0a; --warn-bg: #3a3014; --err: #f2867d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             max-width: 640px; margin: 0 auto; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header a.brand { font-weight: 700; color: var(--fg); text-decoration: none; }
    header nav { display: flex; gap: 12px; align-items: center; font-size: 14px; }
    a { color: var(--accent); }
    h1 { font-size: 22px; margin: 8px 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
            margin-bottom: 12px; }
    .btn { display: inline-block; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit;
           font-weight: 600; background: var(--accent); color: var(--accent-fg); text-decoration: none;
           cursor: pointer; text-align: center; }
    .btn.big { display: block; width: 100%; padding: 18px; font-size: 18px; margin-bottom: 16px; }
    .btn.link { background: none; color: var(--accent); padding: 0; font-weight: 400; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; padding: 10px; font: inherit; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--fg); }
    textarea { min-height: 90px; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    label.check { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 4px 12px 4px 0; }
    .field-label { margin-top: 12px; }
    .field-label label { margin: 0 0 4px; }
    .lock { font-size: 13px; }
    .attr { margin: 8px 0; }
    .price input[type=text] { max-width: 140px; }
    label.question { font-weight: 400; }
    ul.problems, ul.messages { margin: 6px 0; padding-left: 20px; }
    .trace pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 4px 0; }
    .trace h3 { font-size: 14px; margin: 16px 0 4px; }
    .trace .msg { border-top: 1px solid var(--line); padding: 6px 0; }
    .location-choice { display: flex; margin: 8px 0; }
    .log-entry { padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
    .muted { color: var(--muted); font-size: 14px; }
    .error { color: var(--err); font-weight: 600; }
    .banner { background: var(--warn-bg); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .list a.item { display: flex; gap: 12px; align-items: center; color: var(--fg); text-decoration: none;
                   padding: 10px 0; border-bottom: 1px solid var(--line); }
    .list img, .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
    form.inline { display: inline; }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <a class="brand" href="/">olx-auto</a>
    <nav>
      <a href="/settings/profile">{{ user.display_name }}</a>
      <a href="/settings/style">Style</a>
      <a href="/settings/olx">OLX</a>
      <form class="inline" method="post" action="/logout"><button class="btn link">Log out</button></form>
    </nav>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
